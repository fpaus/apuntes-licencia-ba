<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="900" rx="24" fill="#ffffff"/>
  <text x="300" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2420">Malas prácticas al manejar</text>

  <!-- 3x3 grid, cell 180x250, gap 14, margin 14 -->

  <!-- Cell 1: pie en el embrague -->
  <g transform="translate(14,60)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- pedal with foot resting -->
    <rect x="66" y="56" width="48" height="15" rx="4" fill="#5d6a62"/>
    <rect x="83" y="71" width="14" height="28" fill="#5d6a62"/>
    <ellipse cx="90" cy="60" rx="24" ry="11" fill="none" stroke="#1d2420" stroke-width="3"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Descansar pie</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">en el embrague</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Provoca desgaste</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">innecesario del</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">embrague.</text>
  </g>

  <!-- Cell 2: embrague en semaforo -->
  <g transform="translate(208,60)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- traffic light + foot on embrague -->
    <rect x="52" y="30" width="20" height="50" rx="5" fill="#5d6a62"/>
    <circle cx="62" cy="42" r="6.5" fill="#c0392b"/>
    <circle cx="62" cy="58" r="6.5" fill="#f2c200"/>
    <circle cx="62" cy="74" r="6.5" fill="#2f8a4f"/>
    <rect x="96" y="58" width="42" height="13" rx="4" fill="#5d6a62"/>
    <rect x="114" y="71" width="13" height="22" fill="#5d6a62"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Pisar el embrague</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">en semáforos</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Genera desgaste</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">y fatiga en el</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">sistema.</text>
  </g>

  <!-- Cell 3: arranque fuerte -->
  <g transform="translate(402,60)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- tachometer in the red -->
    <circle cx="90" cy="58" r="30" fill="none" stroke="#1d2420" stroke-width="3"/>
    <path d="M 108 38 A 30 30 0 0 1 118 58" fill="none" stroke="#c0392b" stroke-width="5"/>
    <line x1="90" y1="58" x2="112" y2="40" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="58" r="4" fill="#1d2420"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Arrancar muy</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">fuerte</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Aumenta el</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">consumo y el</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">desgaste.</text>
  </g>

  <!-- Cell 4: embrague en pendiente -->
  <g transform="translate(14,324)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- car on a slope, foot holding embrague -->
    <path d="M44,80 L140,30 L140,80 Z" fill="none" stroke="#1d2420" stroke-width="3" stroke-linejoin="round"/>
    <rect x="58" y="50" width="34" height="14" rx="4" fill="#5d6a62" transform="rotate(-20 75 57)"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Embrague para</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">sostener en subida</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Desgasta el</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">embrague y causa</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">fallas.</text>
  </g>

  <!-- Cell 5: cambio sin soltar embrague -->
  <g transform="translate(208,324)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- gear shift diagram -->
    <circle cx="90" cy="58" r="26" fill="none" stroke="#1d2420" stroke-width="3"/>
    <line x1="90" y1="58" x2="90" y2="36" stroke="#1d2420" stroke-width="2.5"/>
    <line x1="90" y1="58" x2="70" y2="46" stroke="#1d2420" stroke-width="2.5"/>
    <line x1="90" y1="58" x2="110" y2="46" stroke="#1d2420" stroke-width="2.5"/>
    <line x1="90" y1="58" x2="70" y2="70" stroke="#1d2420" stroke-width="2.5"/>
    <line x1="90" y1="58" x2="110" y2="70" stroke="#1d2420" stroke-width="2.5"/>
    <circle cx="90" cy="58" r="4" fill="#1d2420"/>
    <text x="90" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Cambiar sin soltar</text>
    <text x="90" y="154" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">el embrague del todo</text>
    <text x="90" y="180" text-anchor="middle" font-size="16" fill="#5d6a62">Dificulta el</text>
    <text x="90" y="200" text-anchor="middle" font-size="16" fill="#5d6a62">cambio y daña la</text>
    <text x="90" y="220" text-anchor="middle" font-size="16" fill="#5d6a62">transmisión.</text>
  </g>

  <!-- Cell 6: forzar palanca -->
  <g transform="translate(402,324)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">6</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- gear lever forced by a hand -->
    <rect x="60" y="68" width="60" height="12" rx="4" fill="#5d6a62"/>
    <rect x="84" y="36" width="10" height="36" fill="#5d6a62"/>
    <circle cx="89" cy="32" r="10" fill="#5d6a62"/>
    <path d="M62,24 L76,38 M76,24 L62,38" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Forzar la</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">palanca</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Puede dañar la</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">caja de cambios</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">y sus engranajes.</text>
  </g>

  <!-- Cell 7: bajas revoluciones -->
  <g transform="translate(14,588)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">7</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- tachometer, needle low -->
    <circle cx="90" cy="58" r="30" fill="none" stroke="#1d2420" stroke-width="3"/>
    <line x1="90" y1="58" x2="68" y2="72" stroke="#1d2420" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="58" r="4" fill="#1d2420"/>
    <text x="90" y="30" text-anchor="middle" font-size="12" fill="#5d6a62">RPM</text>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Circular a bajas</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">revoluciones</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">El motor trabaja</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">forzado y se</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">desgasta más.</text>
  </g>

  <!-- Cell 8: curva rapida -->
  <g transform="translate(208,588)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">8</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- curved road taken fast -->
    <path d="M40,80 Q65,20 140,34" fill="none" stroke="#4a4f4c" stroke-width="16" stroke-linecap="round"/>
    <path d="M40,80 Q65,20 140,34" fill="none" stroke="#f2c200" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M118,30 L142,32 L136,54" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Entrar rápido</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">en curvas</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Riesgo de perder</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">control y más</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">desgaste de llantas.</text>
  </g>

  <!-- Cell 9: ignorar punto de mordida -->
  <g transform="translate(402,588)">
    <rect width="180" height="250" rx="12" fill="#fbe7e4"/>
    <circle cx="26" cy="26" r="15" fill="#c0392b"/>
    <text x="26" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">9</text>
    <circle cx="154" cy="26" r="15" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M147,19 L161,33 M161,19 L147,33" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <!-- embrague disc with friction point marker -->
    <circle cx="80" cy="58" r="22" fill="none" stroke="#1d2420" stroke-width="3"/>
    <circle cx="80" cy="58" r="6" fill="#1d2420"/>
    <path d="M80,58 L112,58" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M104,50 L114,58 L104,66" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">Ignorar punto</text>
    <text x="90" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2420">de mordida</text>
    <text x="90" y="184" text-anchor="middle" font-size="16" fill="#5d6a62">Provoca tirones,</text>
    <text x="90" y="204" text-anchor="middle" font-size="16" fill="#5d6a62">desgaste y</text>
    <text x="90" y="224" text-anchor="middle" font-size="16" fill="#5d6a62">pérdida de control.</text>
  </g>

  <!-- footer banner -->
  <rect x="14" y="850" width="572" height="36" rx="10" fill="#e2f1e6"/>
  <text x="300" y="873" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f8a4f">Buenos hábitos = mayor seguridad + menos gastos</text>
</svg>
