<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="450" rx="24" fill="#ffffff"/>
  <text x="300" y="38" text-anchor="middle" font-size="27" font-weight="bold" fill="#1d2420">Malas prácticas al manejar</text>

  <!-- 3x3 grid of cells -->
  <!-- cell geometry: start x=20,y=56 ; cell w=186 h=118 ; gap 8 -->

  <!-- Cell 1: pie en el embrague -->
  <g transform="translate(20,56)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <!-- pedal with foot resting -->
    <rect x="70" y="30" width="46" height="14" rx="4" fill="#5d6a62"/>
    <rect x="86" y="44" width="14" height="30" fill="#5d6a62"/>
    <ellipse cx="93" cy="34" rx="22" ry="10" fill="none" stroke="#1d2420" stroke-width="2"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Pie en el</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">embrague</text>
  </g>

  <!-- Cell 2: embrague en semaforo -->
  <g transform="translate(214,56)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <rect x="68" y="18" width="18" height="46" rx="4" fill="#5d6a62"/>
    <circle cx="77" cy="28" r="6" fill="#c0392b"/>
    <circle cx="77" cy="41" r="6" fill="#f2c200"/>
    <circle cx="77" cy="54" r="6" fill="#2f8a4f"/>
    <rect x="102" y="40" width="40" height="12" rx="3" fill="#5d6a62"/>
    <rect x="118" y="52" width="12" height="20" fill="#5d6a62"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Embrague en</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">semáforo</text>
  </g>

  <!-- Cell 3: arranque fuerte -->
  <g transform="translate(408,56)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <circle cx="80" cy="42" r="22" fill="none" stroke="#1d2420" stroke-width="3"/>
    <path d="M80,42 L94,28" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,30 Q120,30 124,42" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M118,28 L124,42 L110,38" fill="#c0392b"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Arranque</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">fuerte</text>
  </g>

  <!-- Cell 4: embrague en pendiente -->
  <g transform="translate(20,182)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <path d="M55,55 L120,20 L120,55 Z" fill="none" stroke="#1d2420" stroke-width="3"/>
    <rect x="65" y="38" width="30" height="14" rx="3" fill="#5d6a62" transform="rotate(-18 80 45)"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Embrague en</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">pendiente</text>
  </g>

  <!-- Cell 5: cambio sin embrague a fondo -->
  <g transform="translate(214,182)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <circle cx="70" cy="42" r="20" fill="none" stroke="#1d2420" stroke-width="3"/>
    <path d="M70,42 L70,24" stroke="#1d2420" stroke-width="3" stroke-linecap="round"/>
    <path d="M70,42 L84,32" stroke="#1d2420" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="42" r="3" fill="#1d2420"/>
    <circle cx="130" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M123,23 L137,37 M137,23 L123,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="14" fill="#1d2420">Cambiar sin pisar</text>
    <text x="93" y="114" text-anchor="middle" font-size="14" fill="#1d2420">el embrague a fondo</text>
  </g>

  <!-- Cell 6: forzar palanca -->
  <g transform="translate(408,182)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <rect x="60" y="48" width="56" height="10" rx="3" fill="#5d6a62"/>
    <rect x="82" y="22" width="8" height="34" fill="#5d6a62"/>
    <circle cx="86" cy="20" r="8" fill="#5d6a62"/>
    <path d="M60,16 L72,28 M72,16 L60,28" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Forzar la</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">palanca</text>
  </g>

  <!-- Cell 7: bajas revoluciones -->
  <g transform="translate(20,308)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <circle cx="80" cy="40" r="24" fill="none" stroke="#1d2420" stroke-width="3"/>
    <path d="M80,40 L62,52" stroke="#1d2420" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="40" r="3" fill="#1d2420"/>
    <text x="80" y="22" font-size="11" fill="#5d6a62">RPM</text>
    <circle cx="140" cy="28" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M133,21 L147,35 M147,21 L133,35" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Bajas</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">revoluciones</text>
  </g>

  <!-- Cell 8: curva rapida -->
  <g transform="translate(214,308)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <path d="M35,60 Q60,15 120,25" fill="none" stroke="#4a4f4c" stroke-width="14" stroke-linecap="round"/>
    <path d="M35,60 Q60,15 120,25" fill="none" stroke="#f2c200" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M100,22 L122,24 L118,42" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="30" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M143,23 L157,37 M157,23 L143,37" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="16" fill="#1d2420">Curva</text>
    <text x="93" y="114" text-anchor="middle" font-size="16" fill="#1d2420">rápida</text>
  </g>

  <!-- Cell 9: ignorar punto de friccion -->
  <g transform="translate(408,308)">
    <rect width="186" height="118" rx="12" fill="#fbe7e4"/>
    <circle cx="70" cy="42" r="18" fill="none" stroke="#1d2420" stroke-width="3"/>
    <circle cx="70" cy="42" r="5" fill="#1d2420"/>
    <path d="M70,42 L95,42" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M90,35 L98,42 L90,49" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="28" r="13" fill="#fbe7e4" stroke="#c0392b" stroke-width="3"/>
    <path d="M133,21 L147,35 M147,21 L133,35" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="98" text-anchor="middle" font-size="14" fill="#1d2420">Ignorar punto</text>
    <text x="93" y="114" text-anchor="middle" font-size="14" fill="#1d2420">de fricción</text>
  </g>
</svg>
