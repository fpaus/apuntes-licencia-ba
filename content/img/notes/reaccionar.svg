<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="450" rx="24" fill="#ffffff"/>
  <text x="300" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d2420">Si un auto se te mete de golpe</text>

  <!-- top-down two-lane road, vertical -->
  <rect x="190" y="56" width="220" height="330" fill="#4a4f4c"/>
  <!-- lane divider dashed yellow -->
  <line x1="300" y1="56" x2="300" y2="386" stroke="#f2c200" stroke-width="3" stroke-dasharray="14 12"/>
  <!-- edge lines white -->
  <line x1="190" y1="56" x2="190" y2="386" stroke="#ffffff" stroke-width="3"/>
  <line x1="410" y1="56" x2="410" y2="386" stroke="#ffffff" stroke-width="3"/>

  <!-- your car bottom, left lane, pointing up -->
  <g transform="translate(245,320)">
    <rect x="0" y="0" width="40" height="64" rx="10" fill="#2f8a4f"/>
    <rect x="7" y="10" width="26" height="16" rx="4" fill="#e2f1e6"/>
    <path d="M20,-14 L8,2 L32,2 Z" fill="#2f8a4f"/>
  </g>

  <!-- other car cutting in from the right -->
  <g transform="translate(430,190) rotate(-38)">
    <rect x="0" y="0" width="38" height="60" rx="10" fill="#c0392b"/>
    <rect x="6" y="9" width="26" height="15" rx="4" fill="#fbe7e4"/>
  </g>
  <!-- cutting-in path arrow (red, dashed, crossed) -->
  <path d="M452,170 Q400,210 330,230" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M345,222 L330,230 L340,245" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- straight green arrow: mantene tu carril -->
  <path d="M265,300 L265,100" stroke="#2f8a4f" stroke-width="5" stroke-linecap="round"/>
  <path d="M250,122 L265,96 L280,122" fill="none" stroke="#2f8a4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- swerve arrow crossed out (red dashed) -->
  <path d="M265,300 Q210,220 290,160 Q340,120 265,96" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 6"/>
  <g transform="translate(265,180)">
    <circle r="16" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
    <path d="M-9,-9 L9,9 M9,-9 L-9,9" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- labels, placed outside the road to avoid overlap -->
  <line x1="415" y1="100" x2="280" y2="108" stroke="#2f8a4f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="420" y="104" font-size="15" font-weight="bold" fill="#2f8a4f">Mantené tu carril</text>

  <line x1="415" y1="138" x2="290" y2="172" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="420" y="142" font-size="15" font-weight="bold" fill="#c0392b">Sin volantazo</text>

  <!-- 5 steps as short numbered labels at bottom -->
  <g font-size="13" fill="#1d2420">
    <text x="24" y="406">1. Sin volantazo</text>
    <text x="150" y="406">2. Soltá el acelerador</text>
    <text x="300" y="406">3. Frená progresivo</text>
    <text x="24" y="428">4. Buscá vía de escape</text>
    <text x="220" y="428">5. Mantené el carril</text>
  </g>
</svg>
