<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="450" rx="24" fill="#ffffff"/>
  <text x="300" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1d2420">¿Qué sube o baja el consumo?</text>

  <!-- two column headers -->
  <rect x="24" y="56" width="268" height="40" rx="10" fill="#e2f1e6"/>
  <text x="158" y="82" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f8a4f">Ahorra</text>

  <rect x="308" y="56" width="268" height="40" rx="10" fill="#fbe7e4"/>
  <text x="442" y="82" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">Gasta más</text>

  <!-- AHORRA column rows -->
  <!-- row1: velocidad constante -->
  <g transform="translate(24,108)">
    <rect width="268" height="78" rx="10" fill="#e2f1e6"/>
    <path d="M18,39 L60,39" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round"/>
    <path d="M52,31 L62,39 L52,47" fill="none" stroke="#2f8a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="39" r="4" fill="#2f8a4f"/>
    <text x="90" y="34" font-size="15" fill="#1d2420">Velocidad</text>
    <text x="90" y="52" font-size="15" fill="#1d2420">constante</text>
  </g>

  <!-- row2: manejo suave -->
  <g transform="translate(24,196)">
    <rect width="268" height="78" rx="10" fill="#e2f1e6"/>
    <path d="M14,45 Q34,25 54,45 Q34,55 14,45 Z" fill="none" stroke="#2f8a4f" stroke-width="3"/>
    <circle cx="34" cy="40" r="4" fill="#2f8a4f"/>
    <text x="90" y="34" font-size="15" fill="#1d2420">Manejo</text>
    <text x="90" y="52" font-size="15" fill="#1d2420">suave</text>
  </g>

  <!-- GASTA column rows -->
  <!-- row1: frenar y acelerar -->
  <g transform="translate(308,108)">
    <rect width="268" height="78" rx="10" fill="#fbe7e4"/>
    <path d="M14,30 L30,45 L14,60" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44,60 L60,45 L44,30" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="34" font-size="15" fill="#1d2420">Frenar y</text>
    <text x="90" y="52" font-size="15" fill="#1d2420">acelerar seguido</text>
  </g>

  <!-- row2: ir muy rapido -->
  <g transform="translate(308,196)">
    <rect width="268" height="78" rx="10" fill="#fbe7e4"/>
    <path d="M12,45 L56,45" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <path d="M44,33 L58,45 L44,57" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18,32 L8,45 L18,58" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <text x="90" y="34" font-size="15" fill="#1d2420">Ir demasiado</text>
    <text x="90" y="52" font-size="15" fill="#1d2420">rápido</text>
  </g>

  <!-- row3: aire acondicionado -->
  <g transform="translate(308,284)">
    <rect width="268" height="52" rx="10" fill="#fbe7e4"/>
    <path d="M30,20 L30,44 M18,26 L42,38 M42,26 L18,38" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="37" font-size="15" fill="#1d2420">Aire acondicionado</text>
  </g>

  <!-- row4: neumaticos bajos -->
  <g transform="translate(308,344)">
    <rect width="268" height="46" rx="10" fill="#fbe7e4"/>
    <ellipse cx="28" cy="23" rx="16" ry="9" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="90" y="29" font-size="15" fill="#1d2420">Neumáticos bajos</text>
  </g>

  <!-- row combined: peso extra + subidas below, full width small row -->
  <g transform="translate(308,398)">
    <rect width="268" height="40" rx="10" fill="#fbe7e4"/>
    <rect x="14" y="10" width="26" height="18" rx="3" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="90" y="25" font-size="14" fill="#1d2420">Peso extra y subidas</text>
  </g>

  <!-- AHORRA column filler to balance space: leave rest blank, add small note -->
  <g transform="translate(24,284)">
    <rect width="268" height="154" rx="10" fill="#e2f1e6" opacity="0.5"/>
    <text x="134" y="84" text-anchor="middle" font-size="14" fill="#5d6a62">El consumo depende</text>
    <text x="134" y="104" text-anchor="middle" font-size="14" fill="#5d6a62">más de cómo manejás</text>
    <text x="134" y="124" text-anchor="middle" font-size="14" fill="#5d6a62">que de la velocidad sola.</text>
  </g>
</svg>
