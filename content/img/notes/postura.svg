<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="450" rx="24" fill="#ffffff"/>

  <text x="300" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1d2420">Postura al conducir</text>
  <text x="300" y="58" text-anchor="middle" font-size="14" fill="#5d6a62">Apoyacabezas a la altura de la cabeza</text>

  <!-- side view schematic: seat back, headrest, torso-hip-knee figure, steering wheel -->
  <g>
    <!-- seat back -->
    <rect x="110" y="110" width="26" height="200" rx="10" fill="#d9e0d9"/>
    <!-- headrest -->
    <rect x="106" y="90" width="42" height="32" rx="10" fill="#d9e0d9"/>
    <text x="127" y="82" text-anchor="middle" font-size="12" fill="#5d6a62">Apoyacabezas</text>

    <!-- torso: shoulder (165,160) to hip (150,250) -->
    <circle cx="165" cy="160" r="9" fill="#1d2420"/>
    <line x1="165" y1="160" x2="150" y2="250" stroke="#1d2420" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="250" r="8" fill="#1d2420"/>

    <!-- hip angle arc (small, at the joint) + label (left margin, clear of the seat back) -->
    <path d="M 150 250 A 20 20 0 0 1 166 236" fill="none" stroke="#2f8a4f" stroke-width="2"/>
    <text x="100" y="236" text-anchor="end" font-size="13" fill="#2f8a4f" font-weight="bold">Cadera</text>
    <text x="100" y="252" text-anchor="end" font-size="13" fill="#2f8a4f" font-weight="bold">100°–115°</text>

    <!-- thigh: hip to knee -->
    <line x1="150" y1="250" x2="240" y2="278" stroke="#1d2420" stroke-width="6" stroke-linecap="round"/>
    <circle cx="240" cy="278" r="8" fill="#1d2420"/>

    <!-- knee angle arc (small, at the joint) + label, placed to the right of the knee, clear of the shin -->
    <path d="M 240 278 A 18 18 0 0 1 228 262" fill="none" stroke="#c98a00" stroke-width="2"/>
    <text x="265" y="254" font-size="13" fill="#c98a00" font-weight="bold">Rodilla</text>
    <text x="265" y="270" font-size="13" fill="#c98a00" font-weight="bold">120°–135°</text>

    <!-- shin: knee to foot (pedal) -->
    <line x1="240" y1="278" x2="255" y2="330" stroke="#1d2420" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="266" cy="336" rx="18" ry="8" fill="#5d6a62"/>

    <!-- arm: shoulder to steering wheel -->
    <line x1="165" y1="160" x2="330" y2="200" stroke="#1d2420" stroke-width="5" stroke-linecap="round"/>

    <!-- steering wheel -->
    <circle cx="350" cy="205" r="55" fill="none" stroke="#5d6a62" stroke-width="10"/>
    <circle cx="350" cy="205" r="10" fill="#5d6a62"/>
    <text x="350" y="282" text-anchor="middle" font-size="13" fill="#5d6a62">Volante</text>

    <!-- distance to wheel, drawn low and clear of the figure -->
    <line x1="150" y1="390" x2="350" y2="390" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,5"/>
    <line x1="150" y1="380" x2="150" y2="400" stroke="#c0392b" stroke-width="2"/>
    <line x1="350" y1="380" x2="350" y2="400" stroke="#c0392b" stroke-width="2"/>
    <text x="250" y="414" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">25–30 cm al volante</text>

    <!-- floor -->
    <line x1="60" y1="358" x2="560" y2="358" stroke="#d9e0d9" stroke-width="3"/>
  </g>
</svg>
