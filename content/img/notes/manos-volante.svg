<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="600" height="450" rx="24" fill="#ffffff"/>

  <text x="300" y="38" text-anchor="middle" font-size="27" font-weight="bold" fill="#1d2420">Manos en el volante</text>

  <!-- clock-face steering wheel, center 300,235, radius 150 -->
  <g>
    <circle cx="300" cy="235" r="150" fill="none" stroke="#5d6a62" stroke-width="22"/>
    <circle cx="300" cy="235" r="18" fill="#5d6a62"/>

    <!-- clock positions: 12 at top, clockwise. angle for hour h: (h*30 - 90) deg -->
    <!-- helper dots at 9 and 3 (green, Mejor) -->
    <circle cx="150" cy="235" r="14" fill="#2f8a4f"/>
    <circle cx="450" cy="235" r="14" fill="#2f8a4f"/>
    <!-- 10 and 2 (amber, Normal) -->
    <circle cx="188" cy="153" r="14" fill="#c98a00"/>
    <circle cx="412" cy="153" r="14" fill="#c98a00"/>
    <!-- 12, 6, 7, 5 (red, Peligro) -->
    <circle cx="300" cy="85" r="14" fill="#c0392b"/>
    <circle cx="300" cy="385" r="14" fill="#c0392b"/>
    <circle cx="225" cy="358" r="14" fill="#c0392b"/>
    <circle cx="375" cy="358" r="14" fill="#c0392b"/>

    <!-- hour labels -->
    <text x="300" y="58" text-anchor="middle" font-size="14" fill="#1d2420">12</text>
    <text x="438" y="128" text-anchor="middle" font-size="14" fill="#1d2420">2</text>
    <text x="480" y="240" text-anchor="middle" font-size="14" fill="#1d2420">3</text>
    <text x="402" y="358" text-anchor="middle" font-size="14" fill="#1d2420">5</text>
    <text x="316" y="372" text-anchor="middle" font-size="14" fill="#1d2420">6</text>
    <text x="266" y="372" text-anchor="middle" font-size="14" fill="#1d2420">7</text>
    <text x="120" y="240" text-anchor="middle" font-size="14" fill="#1d2420">9</text>
    <text x="162" y="128" text-anchor="middle" font-size="14" fill="#1d2420">10</text>
  </g>

  <!-- legend -->
  <g font-size="15">
    <circle cx="55" cy="422" r="9" fill="#2f8a4f"/>
    <text x="72" y="427" fill="#1d2420">9 y 3: Mejor</text>

    <circle cx="225" cy="422" r="9" fill="#c98a00"/>
    <text x="242" y="427" fill="#1d2420">10 y 2: Normal</text>

    <circle cx="410" cy="422" r="9" fill="#c0392b"/>
    <text x="427" y="427" fill="#1d2420">12,6,7,5: Peligro</text>
  </g>
</svg>
